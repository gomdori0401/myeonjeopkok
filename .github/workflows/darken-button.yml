name: Darken active next buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/darken-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Darken active next button style
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = ".nextbtn.active{background:var(--m);color:#fff;box-shadow:0 7px 16px rgba(122,191,245,.24)}"
          new = ".nextbtn.active{background:#2f8ed8;color:#fff;border:1px solid #257fc4;box-shadow:0 9px 20px rgba(47,142,216,.38);transform:translateY(-1px)}"
          if old not in text:
              raise SystemExit('target style not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make active next buttons darker"
          git push
